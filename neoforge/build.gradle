plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.133'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
	id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

version = "${versionProps.getProperty('mod_version')}-neoforge"
group = 'mc.euphoria_patches'

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = "EuphoriaPatcher"
}

def neoforgeProps = new Properties()
file("gradle.properties").withInputStream { neoforgeProps.load(it) }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Fix the duplicate JavaCompile task configuration
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Add a special task to compile just Main.java with Java 8 compatibility
tasks.register('compileMainClass', JavaCompile) {
    source = fileTree(dir: 'common/src/main/java', include: '**/Main.java')
    destinationDirectory = file("$buildDir/classes/java8/main")
    classpath = configurations.compileClasspath
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    shade
    implementation.extendsFrom(shade)
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':common')
    implementation "net.neoforged:neoforge:${neo_version}"

    // Dependencies to be shadowed
    shade project(':common')
    shade 'io.sigpipe:jbsdiff:1.0'
    shade 'com.google.code.gson:gson:2.8.9'
    shade 'org.apache.commons:commons-compress:1.21'
    shade 'commons-io:commons-io:2.11.0'
    shade 'commons-codec:commons-codec:1.15'
}

// Disable the default jar task
jar.enabled = false

// Configure the shadowJar task
shadowJar {
    dependsOn compileMainClass

    configurations = [project.configurations.shade]

    // Include main classes and resources
    from sourceSets.main.output

    // Add the Java 8 compatible Main.class to the JAR
    from "$buildDir/classes/java8/main"

    // No classifier for final output jar
    archiveClassifier.set('')
    
    // Output to central build/libs directory
    destinationDirectory.set(file("${rootProject.buildDir}/libs"))

    // Relocate ALL the problematic libraries to avoid conflicts
    relocate 'org.apache.commons', 'mc.euphoria_patches.shadow.org.apache.commons'
    relocate 'io.sigpipe.jbsdiff', 'mc.euphoria_patches.shadow.io.sigpipe.jbsdiff'
    relocate 'com.google.gson', 'mc.euphoria_patches.shadow.com.google.gson'

    // Include license file if exists
    from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}.txt"}
	}

    // Only include necessary files
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // Set manifest attributes
    manifest {
        from(project(':common').tasks.jar.manifest)
        attributes([
                "Specification-Title": project.mod_id,
                "Specification-Vendor": project.mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.mod_name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": project.mod_authors
        ])
    }

    // Minimize the JAR by removing unused classes
    minimize()
}

// Set shadowJar as the default jar artifact
artifacts {
    archives shadowJar
}

// Make build task depend on shadowJar
build.dependsOn shadowJar

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/*.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Create a task to validate the changelog
task validateChangelog {
    doLast {
        def baseVersion = project.version.toString().split("-")[0]
        def compVersion = project.version.toString().split("-")[1]

        if (!rootProject.ext.changelogFile.exists()) {
            rootProject.ext.changelogFile.text = "## The entire changelog can be found here: https://euphoriapatches.com/changelogs\n- Updated to Complementary Shaders ${compVersion} + Euphoria Patches ${baseVersion} - This is a minor update"
            throw new GradleException("CHANGELOG.md was missing and has been created. Please update it with release notes and try again.")
        }

        
        def changelogContent = rootProject.ext.changelogFile.text

        if (!changelogContent.contains(baseVersion)) {
            throw new GradleException("CHANGELOG.md does not contain version ${baseVersion}. Please update the changelog before publishing.")
        }
    }
}

// Create a confirmation task that runs before any publishing
task confirmPublish {
    dependsOn validateChangelog

    doLast {
        if (!rootProject.ext.publishConfirmed) {
            println "\n${"="*60}"
            println "PUBLISH CONFIRMATION"
            println "${"="*60}"
            println "Version: ${project.version}"
            println "Dry Run: ${rootProject.ext.publishDryRun}"
            println "${"="*60}"

            System.out.print("Type 'yes' to confirm: ")
            System.out.flush()

            def reader = new BufferedReader(new InputStreamReader(System.in))
            def response = reader.readLine()

            if (response?.toLowerCase()?.trim() != 'yes') {
                throw new GradleException("Publishing cancelled.")
            }

            System.out.print("\nPublish to (1=Both, 2=CurseForge only, 3=Modrinth only): ")
            System.out.flush()

            def platformChoice = reader.readLine()?.trim()

            if (platformChoice == '2') {
                rootProject.ext.skipModrinth = true
                println "Selected: CurseForge only"
            } else if (platformChoice == '3') {
                rootProject.ext.skipCurseforge = true
                println "Selected: Modrinth only"
            } else if (platformChoice == '1') {
                println "Selected: Both platforms"
            } else {
                throw new GradleException("Invalid selection. Publishing cancelled.")
            }

            rootProject.ext.publishConfirmed = true
        }
    }
}

// Make publish tasks depend on confirmation and check skip flags
tasks.whenTaskAdded { task ->
    if (task.name == 'publishCurseforge') {
        task.dependsOn confirmPublish
        task.onlyIf { !project.ext.skipCurseforge }
    }
    if (task.name == 'publishModrinth') {
        task.dependsOn confirmPublish
        task.onlyIf { !project.ext.skipModrinth }
    }
}

publishMods {
    file = shadowJar.archiveFile
	
    changelog = rootProject.ext.changelogFile.text

    type = STABLE
    modLoaders.add("neoforge")

	dryRun = rootProject.ext.publishDryRun

    curseforge {
        projectId = "915902"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersionRange {
            start = "1.20.5"
            end = "latest"
        }
    }
    modrinth {
        projectId = "4H6sumDB"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersionRange {
            start = "1.20.5"
            end = "latest"
        }
    }
}