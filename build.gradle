plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version '7.1.2'
	id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	shade
	implementation.extendsFrom(shade)
}

dependencies {
	// Minecraft dependencies
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Dependencies to be shadowed
	shade 'io.sigpipe:jbsdiff:1.0'
	shade 'com.google.code.gson:gson:2.8.9'

	// Apache Commons dependencies - these need to be shadowed
	shade 'org.apache.commons:commons-compress:1.21'
	shade 'commons-io:commons-io:2.11.0'
	shade 'commons-codec:commons-codec:1.15'
}

// Disable the default jar task
jar.enabled = false

// Disable unnecessary tasks
tasks.remapSourcesJar.enabled = false

// Configure the shadowJar task
shadowJar {
	configurations = [project.configurations.shade]
	archiveClassifier.set('shadow')

	// Relocate the problematic libraries to avoid conflicts
	relocate 'org.apache.commons', 'mc.euphoria_patches.shadow.org.apache.commons'
	relocate 'io.sigpipe.jbsdiff', 'mc.euphoria_patches.shadow.io.sigpipe.jbsdiff'
	relocate 'com.google.gson', 'mc.euphoria_patches.shadow.com.google.gson'
	
	// Include license file
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}.txt"}
	}

	// Only include necessary files
	exclude 'META-INF/maven/**'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'

	minimize()

	// Force the task to always run and not be UP-TO-DATE
	outputs.upToDateWhen { false }

	manifest {
		from file("MANIFEST.MF")
	}
}

// Configure remapJar to use shadowJar
remapJar {
	dependsOn shadowJar
	input = shadowJar.archiveFile
	archiveClassifier.set('')  // Final jar has no classifier
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

// Clean up the build directory after build
task cleanupJars {
    doLast {
        def buildLibs = file("${buildDir}/libs")
        buildLibs.listFiles().each { file ->
            if (file.name.contains("-shadow.jar")) {
                file.delete()
            }
        }
    }
}

ext.publishConfirmed = false
ext.skipCurseforge = false
ext.skipModrinth = false

// Create a task to validate the changelog
task validateChangelog {
    doLast {
        def changelogFile = file("CHANGELOG.md")
        def baseVersion = project.version.toString().split("-")[0]
        def compVersion = project.version.toString().split("-")[1]

        if (!changelogFile.exists()) {
            changelogFile.text = "## The entire changelog can be found here: https://euphoriapatches.com/changelogs\n- Updated to Complementary Shaders ${compVersion} + Euphoria Patches ${baseVersion} - This is a minor update"
            throw new GradleException("CHANGELOG.md was missing and has been created. Please update it with release notes and try again.")
        }

        
        def changelogContent = changelogFile.text

        if (!changelogContent.contains(baseVersion)) {
            throw new GradleException("CHANGELOG.md does not contain version ${baseVersion}. Please update the changelog before publishing.")
        }
    }
}

// Create a confirmation task that runs before any publishing
task confirmPublish {
    dependsOn validateChangelog

    doLast {
        if (!project.ext.publishConfirmed) {
            println "\n${"="*60}"
            println "PUBLISH CONFIRMATION"
            println "${"="*60}"
            println "Version: ${project.version}"
            println "Dry Run: ${publishMods.dryRun.get()}"
            println "${"="*60}"

            System.out.print("Type 'yes' to confirm: ")
            System.out.flush()

            def reader = new BufferedReader(new InputStreamReader(System.in))
            def response = reader.readLine()

            if (response?.toLowerCase()?.trim() != 'yes') {
                throw new GradleException("Publishing cancelled.")
            }

            System.out.print("\nPublish to (1=Both, 2=CurseForge only, 3=Modrinth only): ")
            System.out.flush()

            def platformChoice = reader.readLine()?.trim()

            if (platformChoice == '2') {
                project.ext.skipModrinth = true
                println "Selected: CurseForge only"
            } else if (platformChoice == '3') {
                project.ext.skipCurseforge = true
                println "Selected: Modrinth only"
            } else if (platformChoice == '1') {
                println "Selected: Both platforms"
            } else {
                throw new GradleException("Invalid selection. Publishing cancelled.")
            }

            project.ext.publishConfirmed = true
        }
    }
}

// Make publish tasks depend on confirmation and check skip flags
tasks.whenTaskAdded { task ->
    if (task.name == 'publishCurseforge') {
        task.dependsOn confirmPublish
        task.onlyIf { !project.ext.skipCurseforge }
    }
    if (task.name == 'publishModrinth') {
        task.dependsOn confirmPublish
        task.onlyIf { !project.ext.skipModrinth }
    }
}

publishMods {
    file = remapJar.archiveFile
	
    // Validate changelog exists and contains version
    def changelogFile = file("CHANGELOG.md")
    
    changelog = changelogFile.text

    type = STABLE
    modLoaders.add("fabric")
    modLoaders.add("quilt")

    dryRun = false

    curseforge {
        projectId = "915902"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersionRange {
            start = "1.14"
            end = "latest"
        }
    }
    modrinth {
        projectId = "4H6sumDB"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersionRange {
            start = "1.14"
            end = "latest"
        }
    }
}

build.finalizedBy cleanupJars

tasks.named('publishMods').configure {
	finalizedBy cleanupJars
}