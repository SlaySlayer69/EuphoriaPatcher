# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.warning.mode=none

# Mod Properties
maven_group=com.euphoriapatches
archives_base_name=EuphoriaPatcher

# Common Mod Metadata
mod_id=euphoria_patcher
mod_name=Euphoria Patcher
mod_license=MPL-2.0
mod_group_id=com.euphoriapatches
mod_authors=SpacEagle17
mod_description=A mod that applies the Euphoria Patches add-on to Complementary Shaders, and the Euphoria Patches integration to Photon.\nEnable and Change Euphoria Patches Settings in the shaderpack settings menu\nReport issues on discord!

# Additional base shaders this build bundles a patch for, beside Complementary.
# Each id matches a ShaderTarget id and resolves to EuphoriaPatches_<version>_<id>.patch;
# patch_source_<id> says which checkout builds that file. A target whose patch is missing is
# left out of the jar and skipped at runtime, so these are optional.
optional_patch_targets=photon
patch_source_photon=../photon_patches/patches

# Publishing Configuration
curseforge_project_id=915902
modrinth_project_id=4H6sumDB
do_live_publishing=true
