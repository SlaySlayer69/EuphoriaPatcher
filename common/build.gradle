plugins {
	id 'java-library'
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
	mavenCentral()
}

dependencies {
	// Common dependencies that ALL mod loaders need
	implementation 'io.sigpipe:jbsdiff:1.0'
	implementation 'com.google.code.gson:gson:2.8.9'
	implementation 'org.apache.commons:commons-compress:1.21'
	implementation 'commons-io:commons-io:2.11.0'
	implementation 'commons-codec:commons-codec:1.15'
	compileOnly 'com.google.guava:guava:32.1.2-jre'

	// OSHI for CPU usage monitoring (optional - only used if available at runtime)
	compileOnly 'com.github.oshi:oshi-core:6.1.6'
	compileOnly("org.jetbrains:annotations:24.1.0")

	// Minecraft-related dependencies (provided by loader-specific modules)
	// These are compileOnly because the actual implementation comes from Minecraft/loader
	compileOnly 'org.apache.logging.log4j:log4j-api:2.17.1'
	compileOnly 'org.apache.logging.log4j:log4j-core:2.17.1'

	// Using it for native image processing
	compileOnly 'org.lwjgl:lwjgl:3.3.3'
	compileOnly 'org.lwjgl:lwjgl-stb:3.3.3'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8

	it.options.compilerArgs.addAll([
		"-Xlint:-options",
		"-Xlint:-processing"
	])
}

// Replace buildDate placeholder in randomUtil.json during resource processing
processResources {
	outputs.upToDateWhen {false} // Always run this task

	def buildDate = new Date().format('yyyy-MM-dd')

	filesMatching('randomUtil.json') {
		filter { line ->
			line.replace('"buildDate": "year-month-day"', "\"buildDate\": \"${buildDate}\"")
		}
	}

	doLast {
		println "\u001B[32m✓ Set buildDate to: ${buildDate}\u001B[0m"
	}
}

// Patch files are build inputs, not sources: they are generated by DevPatchGenerator or by the
// repository that builds a target's patch, and are gitignored here. importPatches copies them
// into the resources so they end up in the jar.
//
// A target id maps to a patch file name the same way ShaderTarget.getPatchResourceName() does:
// the default target adds no suffix, every other one adds "_<id>". So the photon target is
// EuphoriaPatches_<version>_photon.patch.

ext.patchVersion = { rootProject.ext.versionProps.getProperty('mod_version').split("-")[0] }

ext.optionalPatchTargets = ((project.findProperty('optional_patch_targets') ?: '') as String)
	.split(',').collect { it.trim() }.findAll { !it.isEmpty() }

ext.patchFileName = { String target ->
	"EuphoriaPatches_${patchVersion()}${target == 'complementary' ? '' : '_' + target}.patch"
}

// Where to look for a built patch, most specific first
ext.findBuiltPatch = { String target, String fileName ->
	def searchPath = []
	if (project.hasProperty('patchDir')) {
		searchPath << file(project.property('patchDir'))
	}
	def targetSource = project.findProperty("patch_source_${target}")
	if (targetSource) {
		searchPath << rootProject.file(targetSource as String)
	}
	searchPath << rootProject.file('EuphoriaPatchFiles')

	return searchPath.collect { new File(it, fileName) }.find { it.isFile() }
}

// Task to copy built patch files into the resources
task importPatches {
	description = 'Copies built patch files into the resources so they are bundled into the jar'
	group = 'build'
	outputs.upToDateWhen {false} // Always run this task
	doLast {
		def resourcesDir = file("src/main/resources")
		resourcesDir.mkdirs()

		(['complementary'] + optionalPatchTargets).each { target ->
			def fileName = patchFileName(target)
			def destination = new File(resourcesDir, fileName)
			def source = findBuiltPatch(target, fileName)

			// Missing patches are reported by verifyPatchFile, which decides which are fatal
			if (source == null) {
				return
			}

			if (destination.exists() && destination.bytes == source.bytes) {
				println "\u001B[32m✓ ${fileName} already up to date\u001B[0m"
				return
			}

			destination.bytes = source.bytes
			println "\u001B[32m✓ Imported ${fileName} from ${source.parentFile}\u001B[0m"
		}
	}
}

// Task to verify patch file exists with correct version
task verifyPatchFile {
	outputs.upToDateWhen {false} // Always run this task
	dependsOn importPatches
	doLast {
		def expectedPatchFile = patchFileName('complementary')
		def patchFilePath = file("src/main/resources/${expectedPatchFile}")

		// Find what patch file actually exists (if any)
		def actualPatchFile = "NONE"
		def resourcesDir = file("src/main/resources")
		if (resourcesDir.exists()) {
			resourcesDir.listFiles().each { f ->
				if (f.name.endsWith(".patch") && f.name.startsWith("EuphoriaPatches_")) {
					actualPatchFile = f.name
				}
			}
		}

		println "Searching for patch file... expected patch file: ${expectedPatchFile}"

		if (!patchFilePath.exists()) {
			throw new GradleException("""
			❌ PATCH FILE NOT FOUND: ${expectedPatchFile}
			Expected location: common/src/main/resources/${expectedPatchFile}
			Expected Version:  ${expectedPatchFile}
			Current Version:   ${actualPatchFile}
			Fix: Run DevPatchGenerator or copy from EuphoriaPatchFiles/
			""".stripIndent().trim())
		}

		println "\u001B[32m✓ Patch file found: ${expectedPatchFile}\u001B[0m"

		// Optional targets are never fatal: the mod skips a target whose patch is not bundled,
		// so a build without them is a valid Complementary only build
		optionalPatchTargets.each { target ->
			def fileName = patchFileName(target)
			if (file("src/main/resources/${fileName}").exists()) {
				println "\u001B[32m✓ Patch file found: ${fileName}\u001B[0m"
			} else {
				def source = project.findProperty("patch_source_${target}")
				println "\u001B[33m! ${fileName} not found - the ${target} target will be skipped at runtime\u001B[0m"
				println "\u001B[33m  Build it in ${source ?: 'its patch repository'} or pass -PpatchDir=<dir>\u001B[0m"
			}
		}
	}
}

// Only verify patch file during actual builds, not during processResources
// This allows DevPatchGenerator to run without needing the patch file to exist yet
processResources.dependsOn importPatches
jar.dependsOn verifyPatchFile
assemble.dependsOn verifyPatchFile

// Ensure Main.java resources are included
jar {
	manifest {
		attributes(
			'Main-Class': 'com.euphoriapatches.euphoria_patcher.JarLauncher'
		)
	}
}
